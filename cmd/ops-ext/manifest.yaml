id: ops
version: 1.0
lifecycle: [deleted]

# ops-ext: Kubernetes operations through the easyops OpsService. It carries NO
# cluster credentials of its own — every call goes to easyops, which is the
# only component with k8s RBAC.
#
# Two guards apply to every tool:
#   * `namespace`   — only the configured tenant namespace may be touched;
#   * `allow-write` — every state-changing tool is refused unless enabled.
# Secret VALUES are never returned: ops-get-secret reports key names only.
tools:
  - name: ops-list-services
    description: >-
      List the deployed services with phase, readiness, replica counts, image
      and URL. A leading * marks a ready service.
    descriptions:
      zh: >-
        列出已部署的服务，含状态、就绪、副本数、镜像与 URL。行首 * 表示已就绪。
    input_schema:
      type: object
      properties: {}
      required: []

  - name: ops-get-service
    description: Show one service in detail (phase, ready replicas, URL, restarts, message).
    descriptions:
      zh: 查看单个服务的详情（状态、就绪副本、URL、重启次数、消息）。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Service name.
          descriptions:
            zh: 服务名。
      required: [name]

  - name: ops-service-logs
    description: Read a service's container logs (tail lines).
    descriptions:
      zh: 读取服务容器日志（尾部若干行）。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Service name.
          descriptions:
            zh: 服务名。
        tail:
          type: integer
          description: Max lines (default 200).
          descriptions:
            zh: 最大行数（默认 200）。
        previous:
          type: boolean
          description: >-
            Read the PREVIOUS container instance. This is the only way to see
            why a CrashLoopBackOff pod died — the current container may have
            produced no output at all.
          descriptions:
            zh: >-
              读取上一个容器实例的日志。这是查看 CrashLoopBackOff 崩溃原因的唯一办法——
              当前容器可能根本没有输出。
      required: [name]

  - name: ops-deploy-service
    description: >-
      Create or replace a long-lived service (Deployment + Service) from
      structured fields. Requires allow-write.
    descriptions:
      zh: >-
        用结构化字段创建或替换一个长驻服务（Deployment + Service）。需要 allow-write。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Service name.
          descriptions:
            zh: 服务名。
        image:
          type: string
          description: Container image.
          descriptions:
            zh: 容器镜像。
        replicas:
          type: integer
          description: Replica count (default 1).
          descriptions:
            zh: 副本数（默认 1）。
        container_port:
          type: integer
          description: Port the container listens on.
          descriptions:
            zh: 容器监听端口。
        service_port:
          type: integer
          description: Port the Service exposes.
          descriptions:
            zh: Service 暴露的端口。
        env:
          type: object
          description: Environment variables (name -> value).
          descriptions:
            zh: 环境变量（名 -> 值）。
        cpu:
          type: string
          description: CPU limit, e.g. "500m".
          descriptions:
            zh: CPU 限制，如 "500m"。
        memory:
          type: string
          description: Memory limit, e.g. "512Mi".
          descriptions:
            zh: 内存限制，如 "512Mi"。
        command:
          type: array
          description: Entrypoint override.
          descriptions:
            zh: 覆盖 entrypoint。
        namespace:
          type: string
          description: Target namespace (must be the configured one).
          descriptions:
            zh: 目标命名空间（必须是配置的那个）。
      required: [name, image]

  - name: ops-apply-manifest
    description: >-
      Patch a service from an edited multi-document YAML — THE way to upgrade
      (change image tag, env, resources). Always dry_run=true first: it
      validates without changing anything. Requires allow-write.
    descriptions:
      zh: >-
        用编辑过的多文档 YAML 修补服务——这是升级（换镜像 tag、改 env、改资源）的正确方式。
        务必先 dry_run=true：只校验，不做任何改动。需要 allow-write。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Service name.
          descriptions:
            zh: 服务名。
        yaml:
          type: string
          description: The full multi-document manifest (from ops-service-manifest, edited).
          descriptions:
            zh: 完整的多文档 manifest（来自 ops-service-manifest，编辑后）。
        dry_run:
          type: boolean
          description: Validate only, change nothing (default false).
          descriptions:
            zh: 仅校验、不做改动（默认 false）。
      required: [name, yaml]

  - name: ops-rollback-service
    description: >-
      Roll a service back to a previous revision (k8s `rollout undo`).
      Omit revision for the immediately previous one. Requires allow-write.
    descriptions:
      zh: >-
        将服务回滚到之前的某个版本（k8s `rollout undo`）。省略 revision 表示上一个版本。
        需要 allow-write。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Service name.
          descriptions:
            zh: 服务名。
        revision:
          type: integer
          description: Target revision (0/omitted = the previous one).
          descriptions:
            zh: 目标版本（0 或省略表示上一个）。
      required: [name]

  - name: ops-scale-service
    description: Set a service's replica count. Requires allow-write.
    descriptions:
      zh: 设置服务的副本数。需要 allow-write。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Service name.
          descriptions:
            zh: 服务名。
        replicas:
          type: integer
          description: Desired replica count.
          descriptions:
            zh: 期望的副本数。
      required: [name, replicas]

  - name: ops-pause-service
    description: >-
      Pause a service (scale to zero), remembering the count so resume can
      restore it. Requires allow-write.
    descriptions:
      zh: >-
        暂停服务（缩到 0 副本），并记住原副本数以便恢复。需要 allow-write。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Service name.
          descriptions:
            zh: 服务名。
      required: [name]

  - name: ops-resume-service
    description: Resume a paused service (restores the remembered replica count). Requires allow-write.
    descriptions:
      zh: 恢复已暂停的服务（恢复之前记住的副本数）。需要 allow-write。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Service name.
          descriptions:
            zh: 服务名。
      required: [name]

  - name: ops-delete-service
    description: >-
      Delete a service (its Deployment AND its Service object). Use
      ops-pause-service instead if you only want it to stop for a while.
      Requires allow-write.
    descriptions:
      zh: >-
        删除一个服务（Deployment 和 Service 对象一并删除）。如果只是想暂时停掉，
        请用 ops-pause-service。需要 allow-write。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Service name.
          descriptions:
            zh: 服务名。
      required: [name]

  - name: ops-service-manifest
    description: Show a service's live Kubernetes manifest as YAML.
    descriptions:
      zh: 以 YAML 显示服务的实际 Kubernetes manifest。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Service name.
          descriptions:
            zh: 服务名。
      required: [name]

  - name: ops-build-image
    description: >-
      Build a container image from a repository tarball (tar.gz) with the
      cluster buildkitd and push it to the registry. Requires allow-write.
      Returns the FULL build log once the build finishes.
    descriptions:
      zh: >-
        用集群 buildkitd 从仓库 tarball（tar.gz）构建镜像并推送到 registry。
        需要 allow-write。构建完成后返回完整构建日志。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          description: Destination repo path, e.g. "easyagent/myapp".
          descriptions:
            zh: 目标镜像路径，例如 "easyagent/myapp"。
        tag:
          type: string
          description: Destination tag (default "latest").
          descriptions:
            zh: 目标 tag（默认 "latest"）。
        archive:
          type: string
          description: The repo tarball as TEXT (small repos only).
          descriptions:
            zh: 仓库 tar.gz 的文本形式（仅适合小仓库）。
        archive_base64:
          type: string
          description: >-
            The repo tarball base64-encoded. Use this for a real tar.gz (tar
            output contains NUL bytes and cannot survive a JSON string).
          descriptions:
            zh: >-
              仓库 tar.gz 的 base64 编码。真实 tar.gz 请用这个（tar 输出含 NUL 字节，
              无法作为 JSON 字符串传递）。
        dockerfile:
          type: string
          description: Dockerfile path within the archive (default "Dockerfile").
          descriptions:
            zh: 归档内 Dockerfile 路径（默认 "Dockerfile"）。
        context:
          type: string
          description: Build-context subdirectory ("" = root).
          descriptions:
            zh: 构建上下文子目录（"" 表示根目录）。
        build_args:
          type: object
          description: Build args (name -> value).
          descriptions:
            zh: 构建参数（名 -> 值）。
        cache:
          type: boolean
          description: >-
            Enable REGISTRY cache import/export (default TRUE). This is what
            lets the cache outlive the buildkitd pod and be shared between
            daemons. Note a `--mount=type=cache` directory is NOT part of an
            export — only intermediate layers are, so `go mod download` is not
            re-run but its modules are still unpacked. A daemon with a shared
            PVC avoids that extra cost.
          descriptions:
            zh: >-
              启用 registry 缓存导入/导出（默认 TRUE）。这让缓存不随 buildkitd Pod
              消失，并可在多个 daemon 间共享。注意 `--mount=type=cache` 目录不会进导出——
              只有中间层会，所以 `go mod download` 不会重跑，但模块仍需解压。有共享 PVC 的
              daemon 可省掉这部分开销。
        cache_repo:
          type: string
          description: Registry repo holding the cache (default "<repo>-cache").
          descriptions:
            zh: 存放缓存的 registry 路径（默认 "<repo>-cache"）。
        cache_tag:
          type: string
          description: Cache tag (default = the image tag).
          descriptions:
            zh: 缓存 tag（默认同镜像 tag）。
        cache_mode:
          type: string
          description: '"max" (all intermediate layers, default) or "min".'
          descriptions:
            zh: '"max"（所有中间层，默认）或 "min"。'
      required: [repo]

  - name: ops-build-image-stream
    description: >-
      Same as ops-build-image but consumes the STREAMING build endpoint and
      returns as soon as the build reaches a terminal state, together with the
      elapsed time and the (tail-bounded) build log. Use this when you want to
      know how long a build took, or when a build is long enough that a single
      blocking call is uncomfortable. Requires allow-write.
    descriptions:
      zh: >-
        与 ops-build-image 相同，但走「流式」构建接口，在构建到达终态时立即返回，
        并给出耗时与（截尾的）构建日志。当你想知道构建耗时、或构建较长不希望单次阻塞时使用。
        需要 allow-write。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          description: Destination repo path.
          descriptions:
            zh: 目标镜像路径。
        tag:
          type: string
          description: Destination tag (default "latest").
          descriptions:
            zh: 目标 tag（默认 "latest"）。
        archive:
          type: string
          description: The repo tarball as TEXT (small repos only).
          descriptions:
            zh: 仓库 tar.gz 的文本形式（仅适合小仓库）。
        archive_base64:
          type: string
          description: The repo tarball base64-encoded (preferred for real tarballs).
          descriptions:
            zh: 仓库 tar.gz 的 base64（真实 tar.gz 请用这个）。
        dockerfile:
          type: string
          description: Dockerfile path (default "Dockerfile").
          descriptions:
            zh: Dockerfile 路径（默认 "Dockerfile"）。
        context:
          type: string
          description: Build-context subdirectory ("" = root).
          descriptions:
            zh: 构建上下文子目录（"" 表示根目录）。
        build_args:
          type: object
          description: Build args (name -> value).
          descriptions:
            zh: 构建参数（名 -> 值）。
        cache:
          type: boolean
          description: Enable registry cache import/export (default TRUE).
          descriptions:
            zh: 启用 registry 缓存导入/导出（默认 TRUE）。
        cache_repo:
          type: string
          description: Registry repo holding the cache.
          descriptions:
            zh: 存放缓存的 registry 路径。
        cache_tag:
          type: string
          description: Cache tag.
          descriptions:
            zh: 缓存 tag。
        cache_mode:
          type: string
          description: '"max" (default) or "min".'
          descriptions:
            zh: '"max"（默认）或 "min"。'
      required: [repo]

  - name: ops-import-image
    description: >-
      Mirror an upstream image into the deployment registry (a no-op rebuild
      that preserves the image config). Requires allow-write.
    descriptions:
      zh: >-
        把上游镜像镜像到部署 registry（无操作重建，保留镜像配置）。需要 allow-write。
    input_schema:
      type: object
      properties:
        source:
          type: string
          description: Upstream image, e.g. "docker.io/library/redis:7".
          descriptions:
            zh: 上游镜像，例如 "docker.io/library/redis:7"。
        repo:
          type: string
          description: Destination repo path in the deployment registry.
          descriptions:
            zh: 部署 registry 中的目标路径。
        tag:
          type: string
          description: Destination tag (default "latest").
          descriptions:
            zh: 目标 tag（默认 "latest"）。
      required: [source, repo]

  # ---- asynchronous builds ---------------------------------------------------
  # ops-build-image BLOCKS until the build finishes and leaves nothing behind.
  # These give a build an identity, so it can be listed, inspected and canceled.
  # NOTE: build records live in the easyops PROCESS MEMORY — a restart clears
  # them and each replica keeps its own set. Treat them as recent activity, not
  # an audit log.

  - name: ops-create-build
    description: >-
      Start a build in the BACKGROUND and return its id immediately. Use this
      instead of ops-build-image when you want to poll progress, do something
      else meanwhile, or be able to cancel. Requires allow-write.
    descriptions:
      zh: >-
        在后台启动构建并立即返回 id。当你想轮询进度、同时做别的事、或希望能够取消时，
        用它代替 ops-build-image。需要 allow-write。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          description: Destination repo path.
          descriptions:
            zh: 目标镜像路径。
        tag:
          type: string
          description: Destination tag (default "latest").
          descriptions:
            zh: 目标 tag（默认 "latest"）。
        archive:
          type: string
          description: The repo tarball as TEXT (small repos only).
          descriptions:
            zh: 仓库 tar.gz 的文本形式（仅适合小仓库）。
        archive_base64:
          type: string
          description: The repo tarball base64-encoded (preferred for real tarballs).
          descriptions:
            zh: 仓库 tar.gz 的 base64（真实 tar.gz 请用这个）。
        dockerfile:
          type: string
          description: Dockerfile path (default "Dockerfile").
          descriptions:
            zh: Dockerfile 路径（默认 "Dockerfile"）。
        context:
          type: string
          description: Build-context subdirectory ("" = root).
          descriptions:
            zh: 构建上下文子目录（"" 表示根目录）。
        build_args:
          type: object
          description: Build args (name -> value).
          descriptions:
            zh: 构建参数（名 -> 值）。
        cache:
          type: boolean
          description: Enable registry cache import/export (default TRUE).
          descriptions:
            zh: 启用 registry 缓存导入/导出（默认 TRUE）。
        cache_repo:
          type: string
          description: Registry repo holding the cache.
          descriptions:
            zh: 存放缓存的 registry 路径。
        cache_tag:
          type: string
          description: Cache tag.
          descriptions:
            zh: 缓存 tag。
        cache_mode:
          type: string
          description: '"max" (default) or "min".'
          descriptions:
            zh: '"max"（默认）或 "min"。'
      required: [repo]

  - name: ops-list-builds
    description: >-
      List builds newest-first with state, duration, image and error. Records
      are easyops PROCESS MEMORY: a restart clears them.
    descriptions:
      zh: >-
        按时间倒序列出构建，含状态、耗时、镜像与错误。记录存在 easyops 进程内存中：
        重启会清空。
    input_schema:
      type: object
      properties:
        limit:
          type: integer
          description: Max records (default 50; 0 = everything held).
          descriptions:
            zh: 最大条数（默认 50；0 表示全部）。
      required: []

  - name: ops-get-build
    description: >-
      Show one build with its state, duration, image/error and the TAIL of its
      log. This is how you answer "did that build finish, and why did it fail?"
    descriptions:
      zh: >-
        查看单个构建的状态、耗时、镜像/错误，以及日志尾部。这是回答
        「那个构建完成了没有、为什么失败」的方式。
    input_schema:
      type: object
      properties:
        id:
          type: string
          description: Build id (from ops-create-build / ops-list-builds).
          descriptions:
            zh: 构建 id（来自 ops-create-build / ops-list-builds）。
      required: [id]

  - name: ops-cancel-build
    description: >-
      Cancel a running build. A build that already finished is left unchanged
      and its final state is reported. Requires allow-write.
    descriptions:
      zh: >-
        取消正在运行的构建。已完成的构建不会被改动，直接返回其终态。需要 allow-write。
    input_schema:
      type: object
      properties:
        id:
          type: string
          description: Build id.
          descriptions:
            zh: 构建 id。
      required: [id]

  - name: ops-list-pvcs
    description: List persistent volume claims (name, phase, size).
    descriptions:
      zh: 列出持久卷声明（名称、状态、容量）。
    input_schema:
      type: object
      properties:
        include_all:
          type: boolean
          description: >-
            List EVERY claim in the namespace, not only the ones this deployment
            created (default false). The default view is tenant-safe: the
            platform's own claims (postgres-data, garage-data, ...) are hidden.
            Set this when you expect claims but get "none" - they may have been
            created outside easyops.
          descriptions:
            zh: >-
              列出命名空间内的全部 PVC，而不仅是本部署创建的（默认 false）。
              默认视图是租户安全的：平台自建的卷（postgres-data、garage-data 等）会被隐藏。
              当你预期有 PVC 却看到「无」时设这个——它们可能是 easyops 之外创建的。
      required: []

  - name: ops-get-pvc
    description: Show one PVC (phase, size, storage class, mounting workloads).
    descriptions:
      zh: 查看单个 PVC（状态、容量、存储类、挂载它的工作负载）。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: PVC name.
          descriptions:
            zh: PVC 名。
      required: [name]

  - name: ops-create-pvc
    description: >-
      Create a persistent volume claim. Mount it into a service or job with a
      `volumes` entry. Requires allow-write.
    descriptions:
      zh: >-
        创建持久卷声明。可在服务或任务的 `volumes` 中挂载它。需要 allow-write。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: PVC name.
          descriptions:
            zh: PVC 名。
        size:
          type: string
          description: Requested size, e.g. "10Gi".
          descriptions:
            zh: 申请容量，如 "10Gi"。
        storage_class:
          type: string
          description: Storage class ("" = the deployment default).
          descriptions:
            zh: 存储类（"" 表示部署默认值）。
        namespace:
          type: string
          description: Target namespace (must be the configured one).
          descriptions:
            zh: 目标命名空间（必须是配置的那个）。
      required: [name]

  - name: ops-delete-pvc
    description: >-
      Delete a PVC. WARNING: this DESTROYS the data on it. Requires allow-write.
    descriptions:
      zh: >-
        删除 PVC。警告：会销毁其上的数据。需要 allow-write。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: PVC name.
          descriptions:
            zh: PVC 名。
      required: [name]

  - name: ops-list-configmaps
    description: List config map names.
    descriptions:
      zh: 列出 ConfigMap 名称。
    input_schema:
      type: object
      properties: {}
      required: []

  - name: ops-get-configmap
    description: Show a config map's key names (values are not returned).
    descriptions:
      zh: 查看 ConfigMap 的键名（不返回值）。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: ConfigMap name.
          descriptions:
            zh: ConfigMap 名。
      required: [name]

  - name: ops-get-configmap-values
    description: >-
      Show a config map's FULL contents (keys AND values). Config map data is
      not secret (secrets live in Secret objects), and an agent cannot patch a
      config map it cannot read. Use ops-get-configmap for a quick key
      inventory instead.
    descriptions:
      zh: >-
        查看 ConfigMap 的完整内容（键和值）。ConfigMap 数据本身不是机密（机密在
        Secret 对象里），而 agent 无法修改自己读不到的 ConfigMap。
        只想快速看键名请用 ops-get-configmap。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: ConfigMap name.
          descriptions:
            zh: ConfigMap 名。
      required: [name]

  - name: ops-put-configmap
    description: >-
      Create or replace a config map. WARNING: `data` REPLACES the whole
      object — any key you omit is DELETED. Read the current contents with
      ops-get-configmap-values first, then send the complete map. Use
      dry_run=true to validate. Requires allow-write.
    descriptions:
      zh: >-
        创建或替换 ConfigMap。注意：`data` 会整体替换该对象——你遗漏的任何键都会被删除。
        请先用 ops-get-configmap-values 读出当前完整内容，再提交完整的 map。
        可用 dry_run=true 先校验。需要 allow-write。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: ConfigMap name.
          descriptions:
            zh: ConfigMap 名。
        data:
          type: object
          description: >-
            The COMPLETE key/value map. Omitted keys are removed.
          descriptions:
            zh: >-
              完整的键值对。未包含的键会被删除。
        dry_run:
          type: boolean
          description: Validate only, change nothing (default false).
          descriptions:
            zh: 仅校验、不做改动（默认 false）。
        namespace:
          type: string
          description: Target namespace (must be the configured one).
          descriptions:
            zh: 目标命名空间（必须是配置的那个）。
      required: [name, data]

  - name: ops-delete-configmap
    description: Delete a config map. Requires allow-write.
    descriptions:
      zh: 删除 ConfigMap。需要 allow-write。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: ConfigMap name.
          descriptions:
            zh: ConfigMap 名。
      required: [name]

  - name: ops-list-secrets
    description: >-
      List secret names with their KEY NAMES only. Secret values are never
      returned to a client.
    descriptions:
      zh: >-
        列出机密名及其键名。机密值永不返回给客户端。
    input_schema:
      type: object
      properties: {}
      required: []

  - name: ops-get-secret
    description: >-
      Show a secret's KEY NAMES and whether each is set. Values are withheld.
    descriptions:
      zh: >-
        查看机密的键名及其是否已设置。值会被隐去。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Secret name.
          descriptions:
            zh: 机密名。
      required: [name]

  - name: ops-get-secret-values
    description: >-
      Return a secret's FULL contents (keys AND VALUES). This is a privileged
      act: prefer ops-get-secret (key names only) unless you actually need the
      credential. It exists because ops-put-secret REPLACES the whole object,
      so writing without reading first would silently destroy keys.
    descriptions:
      zh: >-
        返回机密的完整内容（键和值）。这是特权操作：除非确实需要该凭据，否则请用
        ops-get-secret（仅键名）。它存在的原因是 ops-put-secret 会整体替换对象，
        不先读就写会静默销毁其他键。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Secret name.
          descriptions:
            zh: 机密名。
      required: [name]

  - name: ops-put-secret
    description: >-
      Create or replace a secret. WARNING: `data` REPLACES the whole object —
      any key you omit is DELETED; read with ops-get-secret-values first.
      `dry_run` validates. Requires allow-write.
    descriptions:
      zh: >-
        创建或替换机密。注意：`data` 会整体替换该对象——遗漏的键会被删除；请先用
        ops-get-secret-values 读出。可用 `dry_run` 校验。需要 allow-write。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Secret name.
          descriptions:
            zh: 机密名。
        data:
          type: object
          description: The COMPLETE key/value map. Omitted keys are removed.
          descriptions:
            zh: 完整的键值对。未包含的键会被删除。
        dry_run:
          type: boolean
          description: Validate only, change nothing (default false).
          descriptions:
            zh: 仅校验、不做改动（默认 false）。
        namespace:
          type: string
          description: Target namespace (must be the configured one).
          descriptions:
            zh: 目标命名空间（必须是配置的那个）。
      required: [name, data]

  - name: ops-delete-secret
    description: Delete a secret. Requires allow-write.
    descriptions:
      zh: 删除机密。需要 allow-write。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Secret name.
          descriptions:
            zh: 机密名。
      required: [name]

  - name: ops-create-job
    description: >-
      Run a container to completion as a Kubernetes Job — e.g. a one-shot
      buildctl build, a migration, a test run. Waits up to 5 minutes for a
      terminal state (a longer job returns as "active"; poll with ops-get-job).
      Requires allow-write.
    descriptions:
      zh: >-
        以 Kubernetes Job 方式运行一次性容器任务（如一次 buildctl 构建、迁移、测试）。
        最多等待 5 分钟到终态（更久的任务返回 "active"，用 ops-get-job 轮询）。需要 allow-write。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Job name (unique within the namespace).
          descriptions:
            zh: 任务名（命名空间内唯一）。
        image:
          type: string
          description: Container image to run.
          descriptions:
            zh: 要运行的容器镜像。
        command:
          type: array
          description: Entrypoint override.
          descriptions:
            zh: 覆盖 entrypoint。
        args:
          type: array
          description: Arguments.
          descriptions:
            zh: 参数。
        env:
          type: object
          description: Environment variables (name -> value).
          descriptions:
            zh: 环境变量（名 -> 值）。
        cpu:
          type: string
          description: CPU limit, e.g. "500m".
          descriptions:
            zh: CPU 限制，如 "500m"。
        memory:
          type: string
          description: Memory limit, e.g. "512Mi".
          descriptions:
            zh: 内存限制，如 "512Mi"。
        restart_policy:
          type: string
          description: Never (default) or OnFailure.
          descriptions:
            zh: Never（默认）或 OnFailure。
        backoff_limit:
          type: integer
          description: Retry cap (default 0 for Never, 6 for OnFailure).
          descriptions:
            zh: 重试上限（Never 默认 0，OnFailure 默认 6）。
        active_deadline_seconds:
          type: integer
          description: Wall-clock deadline for the whole job (0 = none).
          descriptions:
            zh: 整个任务的超时秒数（0 表示不限）。
        ttl_seconds_after_finished:
          type: integer
          description: Auto-delete the finished job after N seconds (0 = keep).
          descriptions:
            zh: 完成后 N 秒自动删除任务（0 表示保留）。
        volumes:
          type: array
          description: PVC mounts, each {claim, mount_path, name?, sub_path?, read_only?}.
          descriptions:
            zh: PVC 挂载，每项 {claim, mount_path, name?, sub_path?, read_only?}。
        node_selector:
          type: object
          description: Node selector labels.
          descriptions:
            zh: 节点选择标签。
        namespace:
          type: string
          description: Target namespace (must be the configured one).
          descriptions:
            zh: 目标命名空间（必须是配置的那个）。
      required: [name, image]

  - name: ops-list-jobs
    description: List jobs with state (active/succeeded/failed), exit code and failure reason.
    descriptions:
      zh: 列出任务及其状态（active/succeeded/failed）、退出码与失败原因。
    input_schema:
      type: object
      properties: {}
      required: []

  - name: ops-get-job
    description: Show one job (state, exit code, failure reason, timestamps).
    descriptions:
      zh: 查看单个任务（状态、退出码、失败原因、时间戳）。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Job name.
          descriptions:
            zh: 任务名。
      required: [name]

  - name: ops-job-logs
    description: Read a job pod's logs (tail lines).
    descriptions:
      zh: 读取任务 Pod 的日志（尾部若干行）。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Job name.
          descriptions:
            zh: 任务名。
        container:
          type: string
          description: Container name ("" = the job's container).
          descriptions:
            zh: 容器名（"" 表示任务的容器）。
        tail:
          type: integer
          description: Max lines (default 200).
          descriptions:
            zh: 最大行数（默认 200）。
      required: [name]

  - name: ops-delete-job
    description: Delete a job and its pods. Requires allow-write.
    descriptions:
      zh: 删除任务及其 Pod。需要 allow-write。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Job name.
          descriptions:
            zh: 任务名。
        propagation:
          type: string
          description: background (default) or foreground.
          descriptions:
            zh: background（默认）或 foreground。
      required: [name]

  # ---- sandboxes -------------------------------------------------------------
  # sandbox-ext operates INSIDE a running sandbox (exec / files / jobs /
  # computer-*). It has no tool to CREATE, LIST, RESOLVE or DELETE one; that
  # half lives here.

  - name: ops-create-sandbox
    description: >-
      Create a worker sandbox (a machine to run commands in) and return its
      URL. Once it is ready, use the sandbox-* / computer-* tools to work
      inside it. Requires allow-write.
    descriptions:
      zh: >-
        创建一个 worker 沙箱（一台可执行命令的机器）并返回其 URL。就绪后用
        sandbox-* / computer-* 工具在里面工作。需要 allow-write。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Sandbox name (unique in the namespace; never reused).
          descriptions:
            zh: 沙箱名（命名空间内唯一，不可复用）。
        image:
          type: string
          description: Worker image ("" = the deployment default).
          descriptions:
            zh: worker 镜像（"" 表示部署默认值）。
        cpu:
          type: string
          description: CPU limit, e.g. "1".
          descriptions:
            zh: CPU 限制，如 "1"。
        memory:
          type: string
          description: Memory limit, e.g. "2Gi".
          descriptions:
            zh: 内存限制，如 "2Gi"。
        env:
          type: object
          description: Environment variables (name -> value).
          descriptions:
            zh: 环境变量（名 -> 值）。
        kvm:
          type: boolean
          description: Request KVM (for VM sandboxes).
          descriptions:
            zh: 申请 KVM（用于 VM 类沙箱）。
        gpu_count:
          type: integer
          description: GPU count.
          descriptions:
            zh: GPU 数量。
        ready_timeout_seconds:
          type: integer
          description: How long to wait for ready (0 = backend default).
          descriptions:
            zh: 等待就绪的秒数（0 表示后端默认）。
        golden_disk:
          type: boolean
          description: Reuse the shared golden-disk base (VM sandboxes).
          descriptions:
            zh: 复用共享 golden-disk 基础镜像（VM 沙箱）。
        volumes:
          type: array
          description: PVC mounts, each {pvc, mount_path, sub_path?, read_only?}.
          descriptions:
            zh: PVC 挂载，每项 {pvc, mount_path, sub_path?, read_only?}。
      required: [name]

  - name: ops-list-sandboxes
    description: List sandboxes with phase, readiness, image and URL.
    descriptions:
      zh: 列出沙箱及其状态、就绪、镜像与 URL。
    input_schema:
      type: object
      properties: {}
      required: []

  - name: ops-get-sandbox
    description: Show one sandbox (phase, readiness, image, URL).
    descriptions:
      zh: 查看单个沙箱（状态、就绪、镜像、URL）。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Sandbox name.
          descriptions:
            zh: 沙箱名。
      required: [name]

  - name: ops-resolve-sandbox
    description: >-
      Return a sandbox's in-cluster URL AND its token — what you need to talk
      to it directly.
    descriptions:
      zh: >-
        返回沙箱的集群内 URL 及其 token——直接访问它所需的东西。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Sandbox name.
          descriptions:
            zh: 沙箱名。
      required: [name]

  - name: ops-delete-sandbox
    description: Delete a sandbox (its Pod, Service and Secret). Requires allow-write.
    descriptions:
      zh: 删除沙箱（Pod、Service、Secret 一并删除）。需要 allow-write。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Sandbox name.
          descriptions:
            zh: 沙箱名。
      required: [name]

  - name: ops-sandbox-logs
    description: >-
      Read a sandbox POD's logs. This is the only way to diagnose a sandbox
      that FAILED to start — sandbox-ext cannot run inside a sandbox that is
      not up. Shows pod phase / restarts / reason when there is no output.
    descriptions:
      zh: >-
        读取沙箱 Pod 的日志。这是诊断「沙箱起不来」的唯一手段——sandbox-ext 无法进入
        一个没起来的沙箱。无输出时会显示 pod 状态 / 重启次数 / 原因。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Sandbox name.
          descriptions:
            zh: 沙箱名。
        tail:
          type: integer
          description: Max lines (default 200).
          descriptions:
            zh: 最大行数（默认 200）。
        previous:
          type: boolean
          description: Read the previous container instance.
          descriptions:
            zh: 读取上一个容器实例的日志。
      required: [name]

config:
  - name: easyops-url
    type: string
    scope: global
    default: ""
    description: The easyops OpsService base URL, e.g. http://easyops.worker.svc.cluster.local.
    descriptions:
      zh: easyops OpsService 的基础 URL，例如 http://easyops.worker.svc.cluster.local。

  - name: easyops-token
    type: string
    kind: secret
    scope: global
    description: >-
      The easyops shared service token (bearer). This value is a SECRET: it is
      never returned to a client.
    descriptions:
      zh: >-
        easyops 的共享服务令牌（bearer）。该值为机密：永不返回给客户端。

  - name: namespace
    type: string
    scope: global
    default: dev
    description: >-
      The ONLY namespace this extension may touch. Every request carrying a
      namespace must match it. Empty disables the check.
    descriptions:
      zh: >-
        本扩展唯一允许操作的命名空间。请求携带的命名空间必须与之一致。留空则关闭检查。

  - name: allow-write
    type: boolean
    scope: global
    default: false
    description: >-
      Enable state-changing tools (build image, create/delete job). OFF by
      default: an agent can still list/get/logs but cannot change anything.
    descriptions:
      zh: >-
        启用会改变状态的工具（构建镜像、创建/删除任务）。默认关闭：agent 仍可列出/查看/看日志，但不能改动任何东西。
